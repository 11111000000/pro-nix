name: Opencode smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: Run repo smoke script
        run: ./scripts/opencode-smoke.sh
