name: Flake Check and Contract Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nix/emacs-recipes/*.nix читают src из submodules/ — нужен checkout с ними
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v17
        with:
          # Use the same NixOS channel as declared in flake.nix
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Run nix flake check
        # git+file://...?submodules=1 чтобы Nix захватил submodules в captured
        # source. `path:.` тоже работает, когда `actions/checkout` уже положил
        # submodules на диск (`submodules: recursive` выше), но `git+file://`
        # ближе к тому, что делает `just switch` локально. AGENTS.md §6c.
        run: nix --extra-experimental-features 'nix-command flakes' flake check "git+file://$PWD?submodules=1" --show-trace
      - name: Run holo-verify
        run: ./tools/holo-verify.sh
