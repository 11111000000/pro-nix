# SOPS-конфиг для шифрования секретов age-ключом.
#
# Что здесь:
#   - creation_rule: кто может расшифровать (любой ключ из списка)
#   - encrypted_regex: шифруем только значения, не ключи (читаемо)
#
# Как получить age-ключ:
#   $ age-keygen -o keys/age.age
#   $ cat keys/age.age.pub    # публичный, кладём в recipients ниже
#
# NB: файл `keys/age.age` (приватный) НИКОГДА не коммитится. Добавьте
# его в .gitignore вашего проекта.

creation_rules:
  - path_regex: .*\.sops\.ya?ml$
    key_groups:
      - age:
          - age1qz3p9w7l5d2v4k6m8n0q2r4t6y8u0i2o4p6r8t0v2w4x6y8a0b2c4d6e8f0
          # ↑ ЗАМЕНИТЕ на свой pubkey. Можно добавить несколько —
          #   каждый сможет расшифровать. Для добавления коллеги:
          #   age-keygen -o key.age && cat key.age.pub
