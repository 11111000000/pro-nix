# Zola config for pro-nix site
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "http://127.0.0.1:8000"
default_language = "ru"
generate_feeds = true
feed_limit = 50
build_search_index = true

[markdown]
external_links_class = "external-link"
render_emoji = false
smart_punctuation = true
allow_html_in_markdown = true

[languages.en]
title = "pro-nix"
description = "Portable NixOS + Emacs + AI-agents stack. Declarative, idempotent, opinionated."
taxonomies = [{ name = "tags", feed = true }]
generate_feeds = true
build_search_index = true

[extra]
build = "0.1.0"
github = "https://github.com/11111000000/pro-nix"
copyright = "про-nix контрибьюторы"

# Design palette (16-color, from conf/Xresources)
[extra.palette]
fg = "#b0b0b0"
bg = "#000000"
fg_dim = "#666666"
fg_light = "#c0c0c0"
bg_light = "#1c1c1c"
surface1 = "#1c1c1c"
surface2 = "#2a2a2a"
surface3 = "#3c3c3c"
border = "#2a2a2a"
accent = "#5cc25c"
warn = "#c2c25c"
info = "#5c5cc2"
danger = "#c25c5c"
special = "#c25cc2"
special2 = "#5cc2c2"
cursor = "#88ff88"

