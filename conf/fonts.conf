<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Aporetic Sans Mono — основной monospace pro-nix; DejaVu — fallback,
       если шрифт не дошёл до closure конкретного хоста. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Aporetic Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Aporetic Sans — основной sans-serif pro-nix; DejaVu — fallback. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Aporetic Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>